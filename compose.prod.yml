name: burk-scm-production

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-service: &backend-service
  image: burk-scm-backend:${BURK_SCM_IMAGE_TAG:-local}
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ${BURK_SCM_ENV_FILE:-.env.production}
  volumes:
    - private_media:/app/media
    - static_assets:/app/staticfiles
  logging: *default-logging

services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  migrate:
    <<: *backend-service
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --threads
      - "2"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  worker:
    <<: *backend-service
    command:
      - python
      - manage.py
      - run_worker
      - --worker-name=production-worker
      - --poll-interval=1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - manage.py
        - check_worker_heartbeat
        - --worker-name=production-worker
        - --max-age=30
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: burk-scm-frontend:${BURK_SCM_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://api:8000
    environment:
      API_ORIGIN: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: "3001"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  proxy:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${BURK_SCM_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_assets:/srv/burk-static:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  private_media:
  static_assets:
