upstream burk_api {
    server api:8000;
    keepalive 32;
}

upstream burk_frontend {
    server frontend:3001;
    keepalive 32;
}

map $http_x_forwarded_proto $trusted_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Packaging media is private and is streamed only by Django's authorized,
    # signed recording endpoint. Never let nginx turn this volume into a CDN.
    location ^~ /media/ {
        return 404;
    }

    location /static/ {
        alias /srv/burk-static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://burk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        proxy_pass http://burk_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
