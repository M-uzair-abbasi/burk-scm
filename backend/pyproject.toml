[project]
name = "burk-scm-backend"
version = "0.1.0"
description = "Burk.pk SCM-OVS backend — inventory, suppliers, purchasing"
requires-python = ">=3.12"
dependencies = [
    # 5.2 is the LTS (security support to April 2028), deliberately not 6.0.
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
]

[tool.uv]
# Environment only — this project is not an installable package.
package = false
